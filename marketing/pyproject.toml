[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-marketing"
version = "0.2.0"
description = "RepoCity marketing: research runs become curated, source-checked context files and posts for approval"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniel Huette" }]
keywords = ["agents", "marketing", "context-engineering", "human-in-the-loop", "provenance"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "pypdf>=5.0,<6",
    "tenacity>=9.0,<10",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
judge = ["anthropic>=1.0,<2"]

[dependency-groups]
dev = [
    "anthropic>=1.0,<2",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
agentic-marketing = "agentic_marketing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_marketing"]

[tool.hatch.build.targets.sdist]
exclude = ["app/node_modules", "app/dist", "app/dev-dist"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "C4", "PIE", "RET", "ARG", "T20", "ERA", "BLE"]

[tool.ruff.lint.per-file-ignores]
"src/agentic_marketing/cli.py" = ["T20"]
"scripts/**" = ["T20"]
"tests/**" = ["ARG"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]
